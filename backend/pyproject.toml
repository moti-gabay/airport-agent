[project]
name = "airport-agent"
version = "0.1.0"
description = "Airport investment intelligence agent: deterministic KPI scoring + Claude tool-use chat"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.60",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pandas>=2.2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
